[project]
name = "thai-gov-news"
version = "0.1.0"
description = "Independent index of Thai government news"
readme = "README.md"
authors = [{ name = "Pongsakorn Thipayanate", email = "contact@fasu.dev" }]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "selectolax>=0.4.12",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
thai-gov-news = "thai_gov_news:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.8", "ty>=0.0.82"]

[tool.ruff]
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning:feedparser.*"]
