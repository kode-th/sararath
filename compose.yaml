name: sararath

services:
  # The read API is a Cloudflare Worker (see ../api); it is not run here.
  scheduler:
    build: ./crawl
    command:
      - sh
      - -c
      - while true; do uv run --no-sync python -m sararath crawl-due; sleep 3600; done
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    restart: unless-stopped

  # thaigov's Cloudflare bot check 403s datacenter IPs, so GitHub Actions never
  # crawls it. Run this on a residential/TH host; it writes to DATABASE_URL (Neon).
  scheduler-thaigov:
    build: ./crawl
    profiles: ['thaigov']
    command:
      - sh
      - -c
      - while true; do uv run --no-sync python -m sararath crawl-due --source thaigov; sleep 3600; done
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    restart: unless-stopped
