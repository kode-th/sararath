name: thai-gov-news

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-govnews}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-govnews}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-govnews}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: ["uv", "run", "--no-sync", "python", "-m", "thai_gov_news", "serve"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-govnews}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-govnews}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  scheduler:
    build: .
    command:
      - sh
      - -c
      - while true; do uv run --no-sync python -m thai_gov_news crawl-due; sleep 3600; done
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-govnews}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-govnews}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
