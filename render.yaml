services:
  - type: web
    name: thai-gov-news-api
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: python -m thai_gov_news serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
