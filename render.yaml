services:
  - type: web
    runtime: python
    name: Thai Gov News APIs
    region: singapore
    plan: free
    rootDir: api
    buildFilter:
      paths:
        - api/**
      ignoredPaths:
        - api/**/*.md
        - api/tests/**
        - api/typings/**
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --no-sync python -m thai_gov_news serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
