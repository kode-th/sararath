pre-commit:
  parallel: true
  commands:
    lint:
      run: mise run lint
    format-check:
      run: uv run ruff format --check .
    typecheck:
      run: mise run typecheck

pre-push:
  commands:
    test:
      run: mise run test

commit-msg:
  commands:
    convention:
      run: uv run python scripts/check-commit-msg.py {1}
