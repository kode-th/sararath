pre-commit:
  parallel: true
  commands:
    lint:
      run: mise run lint
    format-check:
      run: mise run "format:check"
    typecheck:
      run: mise run typecheck

pre-push:
  commands:
    test:
      run: mise run test

commit-msg:
  commands:
    convention:
      run: bunx commitlint --edit {1}
