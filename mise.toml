[tools]
bun = "latest"
lefthook = "latest"
"npm:pyright" = "latest"
python = "3.13.15"
uv = "0.12.17"

# --- format ---------------------------------------------------------------

[tasks.format]
description = "Format Python and TypeScript"
depends = ["format:py", "format:ts"]

[tasks."format:check"]
description = "Check Python and TypeScript formatting"
depends = ["format:py:check", "format:ts:check"]

[tasks."format:py"]
description = "Run ruff format"
dir = "crawl"
run = "uv run ruff format ."

[tasks."format:py:check"]
description = "Check Python formatting"
dir = "crawl"
run = "uv run ruff format --check ."

[tasks."format:ts"]
description = "Run oxfmt across the repo"
run = "bun run format"

[tasks."format:ts:check"]
description = "Check TypeScript and JSON formatting"
run = "bun run format:check"

# --- lint -----------------------------------------------------------------

[tasks.lint]
description = "Lint Python and TypeScript"
depends = ["lint:py", "lint:ts"]

[tasks."lint:py"]
description = "Run ruff check"
dir = "crawl"
run = "uv run ruff check ."

[tasks."lint:ts"]
description = "Run oxlint --type-aware across api and web"
run = "bun run lint"

# --- typecheck ------------------------------------------------------------

[tasks.typecheck]
description = "Typecheck Python, api and web"
depends = ["typecheck:py", "typecheck:api", "typecheck:web"]

[tasks."typecheck:py"]
description = "Run pyright"
dir = "crawl"
run = "pyright"

[tasks."typecheck:api"]
description = "Run tsc (worker)"
dir = "api"
run = "bun run typecheck"

[tasks."typecheck:web"]
description = "Run tsc (web)"
dir = "web"
run = "bun run typecheck"

# --- test / build ---------------------------------------------------------

[tasks.test]
description = "Run pytest"
dir = "crawl"
run = "uv run python -m pytest"

[tasks."web:build"]
description = "Build the web app (SSR smoke)"
dir = "web"
run = "bun run build"

# --- dev ------------------------------------------------------------------

[tasks.dev]
description = "Start dev stack (web + crawl) with hot reload"
run = "docker compose -f compose.yaml -f compose.dev.yaml up --watch"

[tasks."dev:api"]
description = "Run the Hono worker locally on :8787 (needs api/.dev.vars)"
dir = "api"
run = "bun run dev"

[tasks."dev:down"]
description = "Stop dev stack"
run = "docker compose -f compose.yaml -f compose.dev.yaml down"

[tasks."dev:logs"]
description = "Tail dev stack logs"
run = "docker compose -f compose.yaml -f compose.dev.yaml logs -f"

[tasks.migrate]
description = "Apply migrations to the dev database"
run = "docker compose -f compose.yaml -f compose.dev.yaml exec crawl uv run --no-sync python -m alembic upgrade head"
