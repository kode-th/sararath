[tools]
bun = "latest"
lefthook = "latest"
"npm:pyright" = "latest"
python = "3.13.15"
uv = "0.12.17"

[tasks.lint]
description = "Lint Python and web"
depends = ["lint:py", "web:lint"]

[tasks."lint:py"]
description = "Run ruff check"
dir = "api"
run = "uv run ruff check ."

[tasks."web:lint"]
description = "Run oxlint"
dir = "web"
run = "bun run lint"

[tasks."web:lint:fix"]
description = "Run oxlint with fixes"
dir = "web"
run = "bun run lint:fix"

[tasks.format]
description = "Format Python and web"
depends = ["format:py", "web:format"]

[tasks."format:check"]
description = "Check formatting (Python and web)"
depends = ["format:py:check", "web:format:check"]

[tasks."format:py"]
description = "Run ruff format"
dir = "api"
run = "uv run ruff format ."

[tasks."format:py:check"]
description = "Check Python formatting"
dir = "api"
run = "uv run ruff format --check ."

[tasks."web:format"]
description = "Run oxfmt"
dir = "web"
run = "bun run format"

[tasks."web:format:check"]
description = "Check web formatting"
dir = "web"
run = "bun run format:check"

[tasks.typecheck]
description = "Typecheck Python and web"
depends = ["typecheck:py", "web:typecheck"]

[tasks."typecheck:py"]
description = "Run pyright"
dir = "api"
run = "pyright"

[tasks."web:typecheck"]
description = "Run tsc"
dir = "web"
run = "bun run typecheck"

[tasks."web:build"]
description = "Build the web app"
dir = "web"
run = "bun run build"

[tasks."api:openapi"]
description = "Dump the read API OpenAPI schema to api/openapi.json"
dir = "api"
run = "uv run python -m thai_gov_news openapi > openapi.json"

[tasks."web:api-schema"]
description = "Generate web API client types from api/openapi.json"
dir = "web"
run = "bun run generate:api"

[tasks.test]
description = "Run pytest"
dir = "api"
run = "uv run python -m pytest"

[tasks.dev]
description = "Start dev stack (db + api + web) with hot reload and file watch"
run = "docker compose -f compose.yaml -f compose.dev.yaml up --watch"

[tasks."dev:down"]
description = "Stop dev stack"
run = "docker compose -f compose.yaml -f compose.dev.yaml down"

[tasks."dev:logs"]
description = "Tail dev stack logs"
run = "docker compose -f compose.yaml -f compose.dev.yaml logs -f"

[tasks."scheduler:thaigov"]
description = "Start the hourly thaigov crawl (residential/TH egress; writes to .env DATABASE_URL)"
run = "docker compose -f compose.yaml -f compose.dev.yaml --profile thaigov up -d --build scheduler-thaigov"

[tasks."scheduler:thaigov:stop"]
description = "Stop the thaigov scheduler"
run = "docker compose -f compose.yaml -f compose.dev.yaml --profile thaigov stop scheduler-thaigov"

[tasks.migrate]
description = "Apply migrations to the dev database"
run = "docker compose -f compose.yaml -f compose.dev.yaml exec api uv run --no-sync python -m alembic upgrade head"
