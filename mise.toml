[tools]
lefthook = "latest"
"npm:pyright" = "latest"
python = "3.13.15"
uv = "0.12.17"

[tasks.lint]
description = "Run ruff check"
run = "uv run ruff check ."

[tasks.format]
description = "Run ruff format"
run = "uv run ruff format ."

[tasks.typecheck]
description = "Run pyright"
run = "pyright"

[tasks.test]
description = "Run pytest"
run = "uv run pytest"
