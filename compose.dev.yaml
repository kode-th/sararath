name: sararath

services:
  # Build target and interactive shell for migrations/seeds/CLI against the dev
  # database. The read API is a Cloudflare Worker (see ../api); run it with
  # `mise run dev:api` on the host.
  crawl:
    build:
      context: ./crawl
      target: dev
    command: ['sh', '-c', 'sleep infinity']
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    volumes:
      - ./crawl/src:/app/src
      - ./crawl/migrations:/app/migrations
      - ./crawl/alembic.ini:/app/alembic.ini
      - ./crawl/sources:/app/sources
    develop:
      watch:
        - action: rebuild
          path: ./crawl/pyproject.toml
        - action: rebuild
          path: ./crawl/uv.lock

  web:
    build:
      context: .
      dockerfile: web/Dockerfile.dev
    working_dir: /app
    network_mode: host
    environment:
      VITE_API_URL: http://localhost:8787
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    command: sh -c "bun install && exec bun run --filter @sararath/web dev"
    develop:
      watch:
        - action: rebuild
          path: ./bun.lock
        - action: rebuild
          path: ./web/package.json

volumes:
  web_node_modules:
