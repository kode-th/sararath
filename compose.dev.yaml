name: sararath

services:
  # Installs the bun workspace once; api and web wait for it to finish.
  deps:
    build:
      context: .
      dockerfile: web/Dockerfile.dev
      args:
        UID: '${LOCAL_UID:-1000}'
        GID: '${LOCAL_GID:-1000}'
    working_dir: /app
    volumes:
      - .:/app
      - bun_node_modules:/app/node_modules
    command: sh -c "bun install --frozen-lockfile"
    develop:
      watch:
        - action: rebuild
          path: ./bun.lock
        - action: rebuild
          path: ./api/package.json
        - action: rebuild
          path: ./web/package.json

  # Build target and interactive shell for migrations/seeds/CLI against the dev
  # database. Runs `sleep infinity`; exec into it for one-off commands.
  crawl:
    build:
      context: ./crawl
      target: dev
    command: ['sh', '-c', 'sleep infinity']
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    volumes:
      - ./crawl/src:/app/src
      - ./crawl/migrations:/app/migrations
      - ./crawl/alembic.ini:/app/alembic.ini
      - ./crawl/sources:/app/sources
    develop:
      watch:
        - action: rebuild
          path: ./crawl/pyproject.toml
        - action: rebuild
          path: ./crawl/uv.lock

  # Read API (Hono worker) via `wrangler dev` on :8787.
  api:
    build:
      context: .
      dockerfile: web/Dockerfile.dev
      args:
        UID: '${LOCAL_UID:-1000}'
        GID: '${LOCAL_GID:-1000}'
    working_dir: /app
    network_mode: host
    depends_on:
      deps:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - bun_node_modules:/app/node_modules
    command: sh -c "exec bun run --filter @sararath/api dev"

  # SSR frontend via Vite on :3000, pointed at the local worker.
  web:
    build:
      context: .
      dockerfile: web/Dockerfile.dev
      args:
        UID: '${LOCAL_UID:-1000}'
        GID: '${LOCAL_GID:-1000}'
    working_dir: /app
    network_mode: host
    depends_on:
      deps:
        condition: service_completed_successfully
    environment:
      VITE_API_URL: http://localhost:8787
    volumes:
      - .:/app
      - bun_node_modules:/app/node_modules
    command: sh -c "exec bun run --filter @sararath/web dev"

volumes:
  bun_node_modules:
