name: sararath

services:
  api:
    build:
      context: ./api
      target: dev
    command:
      - uv
      - run
      - --no-sync
      - uvicorn
      - sararath.api.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - src
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      CORS_ORIGINS: "*"
    volumes:
      - ./api/src:/app/src
      - ./api/migrations:/app/migrations
      - ./api/alembic.ini:/app/alembic.ini
      - ./api/sources:/app/sources
    ports:
      - "8001:8000"
    develop:
      watch:
        - action: rebuild
          path: ./api/pyproject.toml
        - action: rebuild
          path: ./api/uv.lock

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    working_dir: /app
    network_mode: host
    environment:
      VITE_API_URL: http://localhost:8001
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    command: sh -c "bun install && exec node node_modules/vite/bin/vite.js dev --host 0.0.0.0 --port 3000"
    develop:
      watch:
        - action: rebuild
          path: ./web/package.json
        - action: rebuild
          path: ./web/bun.lock

  scheduler:
    profiles: ["jobs"]

volumes:
  web_node_modules:
