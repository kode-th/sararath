name: thai-gov-news

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-govnews}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-govnews}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-govnews}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      target: dev
    command:
      - uv
      - run
      - --no-sync
      - uvicorn
      - thai_gov_news.api.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - src
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-govnews}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-govnews}
      CORS_ORIGINS: "*"
    volumes:
      - ./api/src:/app/src
      - ./api/migrations:/app/migrations
      - ./api/alembic.ini:/app/alembic.ini
      - ./api/sources:/app/sources
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./api/pyproject.toml
        - action: rebuild
          path: ./api/uv.lock

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    working_dir: /app
    network_mode: host
    environment:
      VITE_API_URL: http://localhost:8001
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    command: sh -c "bun install && exec node node_modules/vite/bin/vite.js dev --host 0.0.0.0 --port 3000"
    develop:
      watch:
        - action: rebuild
          path: ./web/package.json
        - action: rebuild
          path: ./web/bun.lock

  scheduler:
    profiles: ["jobs"]

volumes:
  pgdata:
  web_node_modules:
