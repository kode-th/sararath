name: crawl-due

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: crawl/.python-version
      - run: uv sync --no-dev
        working-directory: crawl

      # thaigov 403s datacenter IPs; WARP gives a Cloudflare egress (others stay direct via NO_PROXY).
      - name: Start Cloudflare WARP proxy
        run: |
          docker run -d --name warp -p 127.0.0.1:1080:1080 \
            --cap-add NET_ADMIN \
            caomingjun/warp@sha256:d50d29d859bd437420bf63256f803e9fac28657c346b6f5ba50e21ffeb93dff2
          for _ in $(seq 1 30); do
            if curl -sf -x http://127.0.0.1:1080 \
              https://www.cloudflare.com/cdn-cgi/trace | grep -q 'warp=on'; then
              echo "WARP connected"
              exit 0
            fi
            sleep 2
          done
          echo "WARP did not connect; thaigov will fail this run"

      - run: uv run python -m sararath crawl-due
        working-directory: crawl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALL_PROXY: http://127.0.0.1:1080
          NO_PROXY: localhost,127.0.0.1,moac.go.th,rd.go.th,prd.go.th
