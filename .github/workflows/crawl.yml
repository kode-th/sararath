name: crawl-due

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: crawl/.python-version
      - run: uv sync --no-dev
        working-directory: crawl
      - run: uv run python -m sararath crawl-due
        working-directory: crawl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # thaigov 403s datacenter IPs, so its requests go through a Thai residential proxy.
          PROXY_LOGIN: ${{ secrets.PROXY_LOGIN }}__cr.th
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
          PROXY_PORT: ${{ secrets.PROXY_PORT }}
